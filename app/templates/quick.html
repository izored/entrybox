<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EntryBox · Quick Drop</title>
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <style>
    :root {
      --bg:#0f1117; --surface:#171a21; --surface2:#1e222b; --border:#2a2f3a;
      --accent:#3b9eff; --text:#e6e8ec; --text2:#8b93a1; --radius:8px;
      --font-mono:'SF Mono',ui-monospace,Menlo,Consolas,monospace;
    }
    * { box-sizing:border-box; margin:0; padding:0; }
    html, body { height:100%; }
    body {
      background:var(--bg); color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
      font-size:14px; display:flex; flex-direction:column; overflow:hidden;
    }
    header {
      display:flex; align-items:center; gap:8px;
      padding:12px 16px; border-bottom:1px solid var(--border);
      -webkit-user-select:none; user-select:none;
    }
    header .dot { width:8px; height:8px; border-radius:50%; background:var(--accent); }
    header .ttl { font-weight:600; font-size:13px; letter-spacing:.3px; }
    header .hint { margin-left:auto; font-size:11px; color:var(--text2); font-family:var(--font-mono); }
    main { flex:1; padding:16px; display:flex; flex-direction:column; gap:12px; overflow:auto; }
    label { font-size:11px; font-weight:600; letter-spacing:.4px; text-transform:uppercase; color:var(--text2); display:block; margin-bottom:5px; }
    .row { display:flex; gap:10px; }
    .row > .field { flex:1; }
    select, input, textarea {
      width:100%; background:var(--surface2); color:var(--text);
      border:1px solid var(--border); border-radius:var(--radius);
      padding:9px 11px; font-size:14px; font-family:inherit; outline:none;
    }
    select:focus, input:focus, textarea:focus { border-color:var(--accent); }
    textarea { resize:none; min-height:84px; line-height:1.5; }
    footer { padding:12px 16px; border-top:1px solid var(--border); display:flex; align-items:center; gap:10px; }
    .btn {
      border:none; border-radius:var(--radius); padding:9px 18px;
      font-size:13px; font-weight:600; cursor:pointer;
    }
    .btn-primary { background:var(--accent); color:#06121f; margin-left:auto; }
    .btn-primary:disabled { opacity:.5; cursor:default; }
    .btn-ghost { background:transparent; color:var(--text2); }
    .msg { font-size:12px; color:var(--text2); }
    .msg.ok { color:var(--accent); }
    .msg.err { color:#ff6b6b; }
    .empty { color:var(--text2); font-size:13px; text-align:center; padding:24px 0; }
  </style>
</head>
<body>
  <header>
    <span class="dot"></span>
    <span class="ttl">Quick Drop</span>
    <span class="hint">⏎ send · esc close</span>
  </header>

  <main id="form">
    <div class="row">
      <div class="field">
        <label for="project">Project</label>
        <select id="project"></select>
      </div>
      <div class="field" style="flex:0 0 130px">
        <label for="type">Type</label>
        <select id="type">
          <option value="idea">idea</option>
          <option value="fix">fix</option>
          <option value="improve">improve</option>
          <option value="docs">docs</option>
          <option value="roadmap">roadmap</option>
        </select>
      </div>
    </div>
    <div class="field">
      <label for="title">Title</label>
      <input id="title" type="text" placeholder="What's the idea?" autocomplete="off">
    </div>
    <div class="field">
      <label for="body">Note <span style="text-transform:none;font-weight:400">(optional)</span></label>
      <textarea id="body" placeholder="Details…"></textarea>
    </div>
  </main>

  <footer>
    <span id="msg" class="msg"></span>
    <button id="submit" class="btn btn-primary">Drop it</button>
  </footer>

<script>
const API = location.origin;
const $ = id => document.getElementById(id);
const LAST_KEY = 'eb_quick_last_project';

async function applyTheme() {
  try {
    const r = await fetch(API + '/api/themes/active');
    const { vars } = await r.json();
    if (vars) for (const [k, v] of Object.entries(vars)) document.documentElement.style.setProperty(k, v);
  } catch (e) {}
}

async function loadProjects() {
  const sel = $('project');
  try {
    const r = await fetch(API + '/api/projects');
    const { projects } = await r.json();
    const usable = projects.filter(p => p.status !== 'unreachable');
    if (!usable.length) {
      sel.innerHTML = '<option value="">No projects — register one in EntryBox</option>';
      $('submit').disabled = true;
      return;
    }
    // DOM construction, not innerHTML — project names are user input.
    sel.replaceChildren(...usable.map(p => {
      const o = document.createElement('option');
      o.value = p.id;
      o.textContent = `${p.name} · ${p.prefix}`;
      return o;
    }));
    const last = localStorage.getItem(LAST_KEY);
    if (last && usable.some(p => p.id === last)) sel.value = last;
  } catch (e) {
    sel.innerHTML = '<option value="">Server unreachable</option>';
    $('submit').disabled = true;
  }
}

function setMsg(text, cls) { const m = $('msg'); m.textContent = text; m.className = 'msg ' + (cls || ''); }

function hide() { if (window.pywebview && window.pywebview.api) window.pywebview.api.hide_window(); }

async function submit() {
  const project = $('project').value;
  const title = $('title').value.trim();
  if (!project || !title) { setMsg('Title required', 'err'); $('title').focus(); return; }
  $('submit').disabled = true;
  setMsg('Saving…');
  try {
    const r = await fetch(`${API}/api/projects/${project}/entries`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ title, body: $('body').value.trim(), type: $('type').value }),
    });
    const data = await r.json();
    if (!r.ok || data.error) throw new Error(data.error || 'Failed');
    localStorage.setItem(LAST_KEY, project);
    setMsg(`${data.id} dropped ✓`, 'ok');
    $('title').value = ''; $('body').value = '';
    $('title').focus();
  } catch (e) {
    setMsg(e.message || 'Failed', 'err');
  } finally {
    $('submit').disabled = false;
  }
}

$('submit').addEventListener('click', submit);
$('title').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); submit(); } });
$('body').addEventListener('keydown', e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); submit(); } });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { e.preventDefault(); hide(); } });

(async () => { await applyTheme(); await loadProjects(); $('title').focus(); })();
</script>
</body>
</html>
